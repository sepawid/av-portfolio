
x-redash-env: &redash-env
  PYTHONUNBUFFERED: 1
  REDASH_LOG_LEVEL: "INFO"
  REDASH_REDIS_URL: "redis://redis:6379/0"
  REDASH_DATABASE_URL: "postgresql://postgres:postgres@postgres/postgres"
  REDASH_COOKIE_SECRET: "verysecret"

services:
  server:
    image: redash/redash:10.1.0.b50633
    command: server
    depends_on:
      - postgres
      - redis
    ports:
      - "5000:5000"
    environment:
      <<: *redash-env
      REDASH_WEB_WORKERS: 4
    volumes:
      - ./data/outputs:/data

  scheduler:
    image: redash/redash:10.1.0.b50633
    command: scheduler
    depends_on:
      - server
    environment:
      <<: *redash-env
    volumes:
      - ./data/outputs:/data

  worker:
    image: redash/redash:10.1.0.b50633
    command: worker
    depends_on:
      - server
    environment:
      <<: *redash-env
    volumes:
      - ./data/outputs:/data

  redis:
    image: redis:6-alpine

  postgres:
    image: postgres:12-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
