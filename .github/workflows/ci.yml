name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy (strict)
        run: PYTHONPATH=src uv run mypy src

      - name: Pytest
        run: uv run pytest -q

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Generate mock data (SEED=42)
        run: uv run python generator.py

      - name: Run KPI pipeline (raw logs -> SQLite report)
        run: uv run python demo_run.py

      - name: Append KPI summary to the job summary
        run: uv run python scripts/ci_kpi_summary.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload KPI report (SQLite)
        uses: actions/upload-artifact@v4
        with:
          name: kpi-report-sqlite
          path: data/outputs/redash_db.sqlite
